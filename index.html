<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منچ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#eef0ff;--mute:#9aa2c8;--panel:#1a1f38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 70% -10%,#2a2f66 0,transparent 60%),radial-gradient(900px 600px at 0% 100%,#3a1d4d 0,transparent 55%),#0d1020}
h1{margin:0;font-weight:900;font-size:clamp(34px,6vw,54px);letter-spacing:-1px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start;padding:18px}
.boardbox{width:min(94vw,640px);padding:10px;border-radius:26px;background:linear-gradient(145deg,#2b3160,#161a33);box-shadow:0 30px 60px #000a,inset 0 1px 0 #fff2}
svg{display:block;width:100%;height:auto;direction:ltr}
.pc{transition:transform .2s ease}
.pc .ring{display:none;fill:none;stroke:#fff;stroke-width:.08}
.pc.can{cursor:pointer}.pc.can .ring{display:block;animation:bl .7s infinite alternate}
@keyframes bl{from{opacity:.2}to{opacity:1}}
.side{width:min(94vw,300px);display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:20px;padding:14px;box-shadow:0 10px 30px #0006,inset 0 1px 0 #fff1}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px solid transparent;opacity:.55}
.pl.on{opacity:1;border-color:var(--c);background:#ffffff0d}
.dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 55%);box-shadow:0 2px 6px #0008}
.pl b{flex:1}.pl small{color:var(--mute)}
.dicebox{display:flex;flex-direction:column;align-items:center;gap:12px}
.dice{width:92px;height:92px;border-radius:20px;padding:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);background:linear-gradient(145deg,#fff,#cfd3ea);border:4px solid var(--c,#888);box-shadow:0 10px 20px #0008;cursor:pointer}
.dice i{border-radius:50%;margin:3px}.dice i.p{background:#1b1f3a;box-shadow:inset 0 2px 3px #0008}
.dice.roll{animation:sh .12s infinite}
@keyframes sh{0%{transform:rotate(-12deg) scale(1.05)}50%{transform:rotate(10deg) translateY(-6px)}100%{transform:rotate(-8deg)}}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;color:#fff;background:linear-gradient(135deg,#7c5cff,#4c8dff);cursor:pointer;box-shadow:0 8px 18px #4c8dff44}
button:disabled{opacity:.4;cursor:default}
#msg{min-height:44px;text-align:center;color:var(--mute);line-height:1.6}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a18e6;padding:18px;z-index:5}
.ov .card{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;padding:26px}
.ov.hide{display:none}
.seat{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#ffffff0d;border:2px solid var(--c);color:var(--ink);box-shadow:none;border-radius:14px}
.seat span{display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.pc{transition:none}.dice.roll,.pc.can .ring{animation:none}}
.dice.ready{box-shadow:0 0 0 4px #fff9,0 0 34px var(--c);animation:rd .8s infinite alternate}
@keyframes rd{to{transform:scale(1.09)}}
@media (prefers-reduced-motion:reduce){.dice.ready{animation:none}}
#loc{background:linear-gradient(135deg,#22c08a,#4c8dff)}
</style>
</head>
<body>
<div class="wrap">
  <div class="boardbox"><svg id="bd" viewBox="0 0 447 447"></svg></div>
  <div class="side">
    <div class="card"><h1 style="font-size:30px;margin-bottom:6px">منچ</h1><div id="room" style="color:var(--mute);font-size:14px;margin-bottom:8px"></div><div id="pls"></div><button id="act" style="width:100%;margin-top:10px;display:none"></button></div>
    <div class="card dicebox">
      <div class="dice" id="dice" title="برای انداختن تاس کلیک کن"></div>
      <button id="rb">تاس بینداز</button>
      <div id="msg"></div>
    </div>
    <button id="leave" style="background:#2a2f55;box-shadow:none">منوی اصلی</button>
  </div>
</div>
<div class="ov" id="setup"><div class="card">
  <h1>منچ</h1>
  <button id="loc">بازی روی همین دستگاه (با دوستان یا کامپیوتر)</button>
  <div style="color:var(--mute);line-height:1.8">یا بازی آنلاین تا ۴ نفر: یک کد اتاق بنویس و همان کد را به دوستانت بده.</div>
  <input id="code" maxlength="12" dir="ltr" style="font:inherit;font-size:24px;text-align:center;padding:12px;border-radius:14px;border:2px solid #4c8dff;background:#0d1020;color:#fff;letter-spacing:4px">
  <button id="go" disabled>در حال اتصال…</button>
  <div id="err" style="color:#ffb3b3;min-height:22px;line-height:1.6"></div>
</div></div>
<div class="ov hide" id="win"><div class="card"><h1 id="wt"></h1><button id="wa">بازی دوباره</button></div></div>

  setTimeout(st,150);
}
function tick(){
  if(!S||S.status!=='playing'||animating||rolling)return;
  const key=S.seq+':'+S.rollSeq+':'+S.phase,t=S.turn,ai=S.seats[t]==='AI';
  if(sched===key||(!ai&&!isMine(t)))return;
  const ok=()=>S&&S.seq+':'+S.rollSeq+':'+S.phase===key;
  if(S.phase==='roll'){if(ai){sched=key;setTimeout(()=>ok()&&roll(true),900)}}
  else if(S.phase==='pick'){const m=myMoves();if(m.length===1||(ai&&m.length)){sched=key;setTimeout(()=>ok()&&doMove(ai?choose(m):m[0]),700)}}
  else if(S.phase==='skip'){sched=key;setTimeout(()=>ok()&&skipTurn(),1200)}
}
function onState(d){
  const first=!S;S=d;me=d.seats.indexOf(uid);
  if(first){vp=d.pos.slice();lastSeq=d.seq;lastRoll=d.rollSeq;face(d.dice);$('setup').classList.add('hide')}
  else{
    if(d.rollSeq!==lastRoll){lastRoll=d.rollSeq;rolling=true;const dc=$('dice');dc.classList.add('roll');let n=0;
      const t=setInterval(()=>{face(1+Math.random()*6|0);if(++n>7){clearInterval(t);dc.classList.remove('roll');rolling=false;face(S.dice);render();tick()}},70)}
    if(d.seq!==lastSeq){lastSeq=d.seq;if(d.anim&&!animating)runAnim(d.anim);else if(!animating)vp=d.pos.slice()}
    else if(!animating)vp=d.pos.slice();
  }
  render();tick();
}
function localRef(){let st=null,cb=null;const emit=()=>cb&&cb({exists:true,data:()=>({...st})});
  return{set:async d=>{st=d;emit()},update:async p=>{st={...st,...p};emit()},onSnapshot(f){cb=f;f({exists:false});return()=>{cb=null}}}}
function joinRoom(code){
  room=code;$('err').textContent='';let created=false;
  if(unsub)unsub();S=null;sched='';animating=false;rolling=false;ref=db.doc('games/'+code);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){
      if(!created&&writable){created=true;ref.set({...fresh(),status:'lobby',seats:isLocal?['L','AI','AI','AI']:['','','',''],turn:0,seq:0,rollSeq:0,ts:Date.now()}).catch(()=>{$('err').textContent='ساخت اتاق ممکن نشد.'})}
      else if(!writable)$('err').textContent='این اتاق وجود ندارد و تو اجازهٔ ساخت آن را نداری.';
      return}
    onState(snap.data())
  },e=>{$('err').textContent='اتصال قطع شد ('+e.code+')'});
}
$('loc').onclick=()=>{isLocal=true;uid='L';writable=true;db={doc:()=>localRef()};joinRoom('local')};
$('go').onclick=()=>{const c=$('code').value.trim().replace(/[^A-Za-z0-9_-]/g,'');if(!c){$('err').textContent='یک کد اتاق وارد کن.';return}
  isLocal=false;if(odb){db=odb;uid=ouid;writable=ow}else{db={doc:p=>peerStore(p.split('/')[1])};uid=pid();writable=true}joinRoom(c)};
$('rb').onclick=()=>roll();$('dice').onclick=()=>roll();
$('leave').onclick=()=>{if(unsub)unsub();unsub=null;S=null;$('win').classList.add('hide');$('setup').classList.remove('hide')};
$('wa').onclick=()=>wr({...fresh(),status:'lobby',seq:S.seq+1});
setInterval(()=>{if(S&&!animating&&!isLocal)render()},3000);
$('code').value=String(1000+Math.random()*9000|0);
vp=Array(16).fill(-1);drawBoard();face(0);
let odb=null,ouid=null,ow=true;
function pid(){try{let v=sessionStorage.getItem('mench-uid');if(!v){v='u'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('mench-uid',v)}return v}catch(e){return 'u'+Math.random().toString(36).slice(2,10)}}
function peerStore(code){
  let st=null,cb=null,conns=[],peer=null,conn=null,host=false;
  const emit=()=>cb&&st&&cb({exists:true,data:()=>({...st})});
  const bc=()=>conns.forEach(c=>c.open&&c.send({t:'s',st}));
  const err=m=>{$('err').textContent=m;$('setup').classList.remove('hide')};
  const startClient=()=>{
    peer=new Peer();
    peer.on('open',()=>{conn=peer.connect('mench-'+code,{reliable:true});
      conn.on('data',m=>{if(m.t==='s'){st=m.st;emit()}});
      conn.on('close',()=>err('ارتباط با میزبان قطع شد.'))});
    peer.on('error',e=>err(e.type==='peer-unavailable'?'اتاق پیدا نشد؛ میزبان باید اول وارد شود.':'خطای اتصال: '+e.type));
  };
  const startHost=()=>{
    peer=new Peer('mench-'+code);
    peer.on('open',()=>{host=true;cb&&cb({exists:false})});
    peer.on('connection',c=>{conns.push(c);c.on('open',()=>st&&c.send({t:'s',st}));
      c.on('data',m=>{if(m.t==='u'&&st){st={...st,...m.p};emit();bc()}});
      c.on('close',()=>{conns=conns.filter(x=>x!==c)})});
    peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(x){}startClient()}else err('خطای اتصال: '+e.type)});
  };
  return{
    set:async d=>{st=d;emit();bc()},
    update:async p=>{if(host){st={...st,...p};emit();bc()}else if(conn&&conn.open)conn.send({t:'u',p});else throw 0},
    onSnapshot(f){cb=f;startHost();return()=>{cb=null;try{peer&&peer.destroy()}catch(e){}}}
  };
}
(async()=>{
  try{
    if(!window.claude||!claude.use)throw 0;
    const d=await claude.use('db'),u=await claude.use('user');
    if(!d||!u)throw 0;
    const id=await u.id();if(!id)throw 0;
    odb=d;ouid=id;ow=(await u.can('data.write'))!==false;
    $('go').disabled=false;$('go').textContent='ورود به اتاق آنلاین';
    if(!ow)$('err').textContent='در حالت آنلاین فقط تماشا می‌کنی؛ برای بازی صاحب صفحه باید دسترسی «مشارکت‌کننده» بدهد.';
  }catch(e){if(typeof Peer!=='undefined'){$('go').disabled=false;$('go').textContent='ورود به اتاق آنلاین'}else $('go').textContent='آنلاین در دسترس نیست'}
})();
</script>
